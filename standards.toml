# The Python, uv and package versions every Deliverome repository keeps to.
#
# Edit this file to bump Python or pin a security fix, then run
# `python scripts/standards.py fanout --dry-run` and, once the plan looks right, without
# --dry-run: it opens one pull request per long-lived branch of every Python repository.
# The dependency guard reads this file from `main` on every pull request, so a branch that
# was missed fails its next PR; a weekly job reports quiet branches. See README.md.

[python]
# The X.Y every project targets: requires-python floor, .python-version, ruff
# target-version, setup-python and CI matrices.
version = "3.14"

[uv]
# Lowest uv allowed in `[tool.uv] required-version` and in setup-uv `version:` pins.
minimum = "0.13.4"
# The exact uv that Claude Code cloud sessions install at startup (their image ships an older
# one): PIN in each repo's .claude/hooks/ensure-uv.sh, rendered from
# managed/claude/ensure-uv.sh. At least `minimum`, and at least 7 days old.
cloud = "0.13.4"

# Security floors: the lowest version any lockfile may pin. A version exactly on its floor
# is exempt from the 7-day age rule, since the fix may be days old. `ecosystem` is pypi,
# crates or npm.
[[floors]]
ecosystem = "pypi"
package = "certifi"
version = "2026.10.19"
reason = "eMudhra CA compromise (2026-10-19)"

[[floors]]
ecosystem = "pypi"
package = "pip"
version = "26.2.2"
reason = "eMudhra CA compromise (2026-10-19)"

[[floors]]
ecosystem = "pypi"
package = "uv"
version = "0.13.4"
reason = "eMudhra CA compromise (2026-10-19)"

[[floors]]
ecosystem = "crates"
package = "webpki-roots"
version = "1.0.10"
reason = "eMudhra CA compromise (2026-10-19)"

[[floors]]
ecosystem = "crates"
package = "webpki-root-certs"
version = "1.0.10"
reason = "eMudhra CA compromise (2026-10-19)"

[[floors]]
ecosystem = "crates"
package = "rustls-webpki"
version = "0.103.16"
reason = "eMudhra CA compromise (2026-10-19)"

# Projects that deliberately stay on another Python. `path` is a directory (or file) inside
# the repository; it and everything under it use `python` instead of the standard.
[[exceptions]]
repo = "deliverome-internal"
path = "envs/census"
python = "3.13"
reason = "tiledbsoma publishes no Python 3.14 wheels yet"

# Which branches count as long-lived is discovered, not listed: the default branch, every
# protected branch, every branch a ruleset covers, and every branch that was the base of at
# least `min_merged_prs` merged pull requests in the last `window_days` (this is what finds
# an unprotected integration branch that PRs merge into). Add or drop branches here as
# "repo:branch" when discovery gets one wrong.
[discovery]
org = "Deliverome-Project"
window_days = 90
min_merged_prs = 2
include = []
# agentflow dev is being retired (2026-10-22): main is the only long-lived branch; drop this
# entry once dev is deleted.
exclude = ["agentflow:dev"]
